name: E2E lockfile preparation
on: push
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p e2e
          cd e2e
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev @playwright/test typescript @types/node@22
          npm audit
          node -e "for (const f of ['package.json','package-lock.json']) console.log('FILE:'+f+':'+Buffer.from(require('fs').readFileSync(f)).toString('base64'))"
