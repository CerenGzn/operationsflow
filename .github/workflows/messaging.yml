name: Messaging integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate optional broker configuration
        run: docker compose --env-file .env.example -f compose.messaging.yml config --quiet
      - name: PostgreSQL and RabbitMQ integration tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -Pmessaging-tests verify
