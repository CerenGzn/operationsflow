
name: OperationsFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, PostgreSQL integration tests, and build
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit all frontend dependencies
        run: npm audit --json
      - name: Audit production dependencies
        run: npm audit --omit=dev --json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Validate full stack configuration
        run: docker compose --env-file .env.example -f compose.full.yml config --quiet
      - name: Build runtime images (no publishing)
        run: docker compose --env-file .env.example -f compose.full.yml build
      - name: Authenticated full-stack smoke test
        run: python3 scripts/container-smoke.py

  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build bundled image without publishing
        run: docker build -f Dockerfile.demo -t operationsflow-demo:ci .
      - name: Verify production bundle and constrained runtime
        run: python3 scripts/bundled-image-smoke.py
