
name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, PostgreSQL integration tests, and build
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect candidate compatibility
        run: |
          npm view vite@7.3.7 engines peerDependencies --json
          npm view vitest@3.2.7 engines dependencies peerDependencies --json
          npm view vitest@4.1.11 engines dependencies peerDependencies --json
          npm view tinypool@2.1.2 engines --json
      - name: Generate minimal same-major candidate lockfile
        run: |
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts vite@7.3.7 vitest@3.2.7
          node -e 'const fs = require("node:fs"); for (const f of ["package.json", "package-lock.json"]) console.log("GENERATED_FILE " + JSON.stringify({path: f, content: fs.readFileSync(f, "utf8")}))'
      - run: npm ci
      - name: Full dependency security report
        continue-on-error: true
        run: npm audit --json
      - name: Production dependency security report
        continue-on-error: true
        run: npm audit --omit=dev --json
      - name: Installed dependency chains
        run: npm ls --all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
