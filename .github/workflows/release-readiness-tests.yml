name: Release readiness tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test fail-closed release policy (offline fixtures only)
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_readiness.py' -v
