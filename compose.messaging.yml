# Optional local broker, separate from the default, full-stack and demo compositions.
services:
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set a local RabbitMQ username}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set a local RabbitMQ password}
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  rabbitmq_data:
