server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Do not log URLs or authentication-related request details.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    # Resolve on requests so backend container recreation does not leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    location ~ ^/(api(?:/|$)|actuator(?:/|$)|v3/api-docs(?:/|$)|swagger-ui(?:/|\.html$)) {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        # Forwarded headers are deliberately not trusted in this local HTTP stack.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        # Re-declare server headers: nginx add_header inheritance is all-or-nothing.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
